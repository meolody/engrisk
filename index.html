<style>
/* Layout: một cột như app điện thoại; trên cùng là thanh XP, giữa là "ngọn núi band", dưới là thẻ kỹ năng */
:root{
  --ink:#0E1A2B; --panel:#16263D; --panel2:#1C3150; --line:#2A4668;
  --text:#EAF0F7; --muted:#9FB2C8; --sun:#FFC145; --sun-ink:#2A1D00;
  --ok:#3DDC97; --bad:#FF6B6B;
  --cL:#5BC0FF; --cR:#B69CFF; --cW:#FF9F6B; --cS:#3DDC97; --cV:#FFC145;
  --display:'Bricolage Grotesque','Be Vietnamese Pro',system-ui,sans-serif;
  --body:'Be Vietnamese Pro',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
body{padding:0 16px 56px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:12px}
.lvl{font-family:var(--display);font-weight:800;background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:4px 10px;white-space:nowrap}
.xpbar{flex:1;height:10px;border-radius:99px;background:var(--panel);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.streak{font-weight:700;white-space:nowrap}
.hero{padding:22px 0 8px}
.hero h1{font-size:2rem;font-weight:800}
.hero p{color:var(--muted);margin:6px 0 0}
.mount{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.mount svg{width:100%;height:auto;display:block}
.sub{color:var(--muted);font-size:.9rem}
.daily{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
.q-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px}
.q-item.done{opacity:.6}
.q-item .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.q-item.done .chk{background:var(--ok);border-color:var(--ok);color:#06241a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:128px}
.card:hover{background:var(--panel2)}
.card h3{font-size:1.15rem}
.card .bar{height:6px;border-radius:9px;background:var(--ink);overflow:hidden;margin-top:auto}
.card .bar i{display:block;height:100%;background:var(--c)}
.btn{background:var(--sun);color:var(--sun-ink);border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-family:var(--display);font-size:1.05rem;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.boss{background:var(--bad);color:#2b0000}
.row{display:flex;gap:10px;margin-top:12px}
.sec{margin:22px 0 4px;font-size:1.05rem}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.85rem}
.badge.off{opacity:.35}
/* Màn làm bài */
.sess{padding-top:14px}
.sesshead{display:flex;align-items:center;gap:12px}
.x{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:38px;height:38px}
.prog{flex:1;height:12px;border-radius:99px;background:var(--panel);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--sun));transition:width .3s}
.combo{font-family:var(--display);font-weight:800;color:var(--sun);min-width:44px;text-align:right}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);margin:18px 0 6px}
.qtext{font-family:var(--display);font-size:1.4rem;font-weight:700;margin:0 0 14px}
.passage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;max-height:34vh;overflow:auto;font-size:.97rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.ok{border-color:var(--ok);background:rgba(61,220,151,.14)}
.opt.bad{border-color:var(--bad);background:rgba(255,107,107,.14)}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--panel2);border:2px solid var(--cL);border-radius:16px;padding:18px;font-weight:700;margin-bottom:14px}
.play small{color:var(--muted);font-weight:400}
.feed{margin-top:14px;border-radius:14px;padding:14px;background:var(--panel2);border-left:6px solid var(--ok)}
.feed.bad{border-left-color:var(--bad)}
.feed b{font-family:var(--display);font-size:1.1rem}
.feed p{margin:6px 0 0;color:var(--muted)}
.tray,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:14px}
.tray{background:var(--panel);border:2px dashed var(--line);margin-bottom:12px}
.chip{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.inp{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:14px;color:var(--text);padding:13px;font:inherit}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;text-align:center;margin:10px 0;color:var(--cS)}
.list{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.sum{text-align:center;padding:30px 0 10px}
.sum .big{font-family:var(--display);font-size:3.4rem;font-weight:800;color:var(--sun)}
.stats{display:flex;gap:10px;margin:18px 0}
.stats div{flex:1;background:var(--panel);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:1.5rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--sun);color:var(--sun-ink);font-weight:800;padding:12px 18px;border-radius:14px;z-index:9;max-width:90%;text-align:center}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
.selb{border-color:var(--sun)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid>div{display:flex;flex-direction:column;gap:10px}
.mgrid .opt{padding:12px 10px;font-size:.95rem}
.dform{display:flex;gap:10px}
a{color:var(--cL)}
.wl{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wl summary{cursor:pointer;font-weight:700}
.wlist{list-style:none;margin:10px 0 0;padding:0;max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.feed a{color:var(--cL)}
/* Chủ đề đỏ trắng: đỏ IELTS làm điểm nhấn, nền trắng, thẻ hồng nhạt */
:root{
  --ink:#FFFFFF; --panel:#FFF3F3; --panel2:#FFE4E5; --line:#F2C6C9;
  --text:#2A1216; --muted:#7A5A5F; --sun:#E4002B; --sun-ink:#FFFFFF; --deep:#A80020;
  --ok:#12A66B; --bad:#B3261E;
  --cL:#1F78D1; --cR:#7A4CD8; --cW:#E8700A; --cS:#12A66B; --cV:#E4002B; --cC:#D81B8A;
  color-scheme:light;
}
body{background:radial-gradient(1200px 380px at 50% -120px,#FFE1E3 0%,#FFFFFF 70%) no-repeat,#fff}
.top{background:rgba(255,255,255,.94);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(228,0,43,.08)}
.lvl{background:var(--sun);color:#fff}
.xpbar{background:var(--panel2)}
.xpbar i{background:linear-gradient(90deg,#FF5A70,#E4002B)}
.hero{background:linear-gradient(135deg,#E4002B 0%,#B8001F 100%);color:#fff;border-radius:22px;padding:22px;margin-top:14px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(228,0,43,.25)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;right:50px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero h1,.hero p{position:relative;z-index:1}
.hero p{color:rgba(255,255,255,.92)}
.mount,.card,.wl,.stats div,.passage{background:#fff;box-shadow:0 4px 14px rgba(120,20,30,.07)}
.mount svg polygon{fill:var(--panel2)}
.card{transition:transform .18s,box-shadow .18s}
.card:hover{background:#fff;transform:translateY(-4px);box-shadow:0 10px 22px rgba(228,0,43,.16)}
.card:active{transform:scale(.97)}
.ico{width:38px;height:38px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:1.05rem}
.btn{background:var(--sun);color:#fff;box-shadow:0 4px 0 var(--deep);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.ghost{background:#fff;color:var(--sun);border:2px solid var(--sun);box-shadow:0 4px 0 var(--line)}
.btn.yes{background:var(--ok);color:#fff;box-shadow:0 4px 0 #0B7A4D}
.btn.no{background:var(--bad);color:#fff;box-shadow:0 4px 0 #7D1710}
.opt{background:#fff;box-shadow:0 3px 0 var(--line);transition:transform .1s,border-color .15s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--sun)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.opt.ok{background:#E3F8EE;border-color:var(--ok)}
.opt.bad{background:#FDE9E7;border-color:var(--bad);animation:shake .35s}
.opt.bad::after{content:" ✗";color:var(--bad);font-weight:800}
.opt.ok::after{content:" ✓";color:var(--ok);font-weight:800}
.q-item.done .chk{color:#fff}
.chip{background:#fff;box-shadow:0 3px 0 var(--line)}
.tray{background:#fff}
.play{background:#fff;border-color:var(--cL)}
.feed{background:var(--panel);border-left-color:var(--ok)}
.feed.bad{border-left-color:var(--bad)}
.feed a,a{color:#B4001F;font-weight:600}
.toast{background:var(--sun);color:#fff;box-shadow:0 8px 20px rgba(228,0,43,.3)}
.prog{background:var(--panel2)}
.x{background:#fff}
.tag{color:var(--c)}
.inp{background:#fff}
.sess,.hero,.mount,.grid{animation:rise .35s both}
.sum .big{color:var(--sun);text-shadow:0 4px 0 var(--panel2)}
.snd{position:fixed;right:14px;bottom:14px;z-index:8;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.1);font-size:1.1rem}
.fx{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--ok);pointer-events:none;z-index:9;animation:floatup 1s forwards}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.phgrp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 4px 14px rgba(120,20,30,.07)}
.phgrp h3{font-size:1.1rem}
.ph{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:0;border-radius:12px;padding:10px 12px;margin-top:8px;transition:transform .1s}
.ph:hover{transform:translateX(4px);background:var(--panel2)}
.ph b{display:block}
.ph span.vi{color:var(--muted);font-size:.9rem}
.ph .sp{margin-left:auto;color:var(--sun);font-weight:800}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-90px) scale(1.3)}}
/* Bố cục full màn hình: sidebar trái như claude.ai, nội dung giữa rộng tối đa 768px; điện thoại dùng thanh tab dưới */
html,body{height:100%}
body{padding:0;margin:0;overflow:hidden}
.shell{display:flex;height:100%;height:100dvh}
.side{width:260px;flex:0 0 260px;background:#FBF4F4;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--text)}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--sun);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.9rem}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--text)}
.nav:hover{background:var(--panel2)}
.nav.on{background:#fff;color:var(--sun);box-shadow:0 1px 4px rgba(120,20,30,.1)}
.nav b{width:22px;text-align:center;font-family:var(--display)}
.sidefoot{margin-top:auto;padding:12px;font-size:.82rem;color:var(--muted)}
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

 .tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);padding:4px 0}
 .tabbar button b{font-family:var(--display);font-size:1.05rem}

 body.insess .tabbar{display:none}

 body.insess .snd{bottom:14px}
}

.flip .front{background:var(--sun)}

/* Lộ trình theo kiểu thẻ giống các trang khác */
.road{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.stage{background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:4px;padding:18px 20px}
.stage.now{border-color:var(--sun);border-left-color:var(--sun)}
.stage.done{border-left-color:var(--ok)}
.sthead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bandtag{background:var(--panel2);color:var(--deep);font-family:var(--display);font-weight:800;padding:6px 12px;border-radius:4px;white-space:nowrap}
.stage.now .bandtag{background:var(--sun);color:#fff}
.sthead h3{font-size:1.2rem}
.sthead .sub{margin-left:auto}
.nowtag{font-size:.75rem;font-weight:700;color:var(--sun);text-transform:uppercase;letter-spacing:.05em}
.goal{margin:12px 0 14px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sk{background:var(--panel);border-left:4px solid var(--c);border-radius:4px;padding:10px 12px;font-size:.93rem}
.sk b{display:block;color:var(--c);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.stmeta{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:10px}
.stmeta div{border:1px dashed var(--line);border-radius:4px;padding:10px 12px;font-size:.93rem}
.stmeta b{display:block;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.stage .btn{width:auto;margin-top:14px;padding:10px 16px}
.hero .lnk,.mount .lnk{background:none;border:0;padding:0;color:var(--sun);font-weight:700}
.side{padding-top:calc(14px + env(safe-area-inset-top))}.top{padding-top:calc(12px + env(safe-area-inset-top))}.pagehead,.sess{padding-top:calc(22px + env(safe-area-inset-top))}</style></head><body><div class="shell"><aside class="side" id="side"></aside><main class="main" id="main"><div class="wrap" id="app"></div></main></div><nav class="tabbar" id="tabbar" aria-label="Điều hướng"></nav><script>

  const o=shuf(POOL().filter(x=>x.w!==v.w)).slice(0,3);
  const base={sk:'V',w:v.w,tag:'Từ vựng'};
  const re=new RegExp('\\b'+v.w+'\\b','i'),fill=re.test(v.ex),df=DEF[v.w],dok=df&&!re.test(df);
  const why=`${v.w} = ${v.vi}. Ví dụ: ${v.ex}`+(df?` Định nghĩa: ${df}.`:'');
  const t=i%4;
  if(t===3&&dok)return mcq({...base,tag:'Định nghĩa tiếng Anh',q:`Từ nào có nghĩa: "${df}"?`,opts:[v.w,...o.map(x=>x.w)],a:0,why});
  if(t===1)return mcq({...base,q:`Từ tiếng Anh nào nghĩa là "${v.vi}"?`,opts:[v.w,...o.map(x=>x.w)],a:0,why});
  if(t===2&&fill)return mcq({...base,tag:'Điền từ',q:v.ex.replace(re,'_____'),opts:[v.w,...o.map(x=>x.w)],a:0,why});
  return mcq({...base,q:`"${v.w}" nghĩa là gì?`,opts:[v.vi,...o.map(x=>x.vi)],a:0,why})})}
function bC(){

 const p=rnd(ALLPH),o=shuf(ALLPH.filter(x=>x[0]!==p[0])).slice(0,3);
 return [...a,mcq({sk:'C',tag:'Cụm câu',q:`Nói thế nào bằng tiếng Anh: "${p[1]}"`,opts:[p[0],...o.map(x=>x[0])],a:0,why:`${p[1]} = ${p[0]}`})]}
function bL(){

 const o=shuf(ORDER).slice(0,2).map(x=>({kind:'order',sk:'W',tag:'Ghép câu',words:x.words,ans:x.a}));

 ${extra?`<p><b>${extra}</b></p>`:''}${nb.length?`<p>Huy hiệu mới: <b>${nb.map(b=>b[1]).join(', ')}</b></p>`:''}

 <h2 class="sec">Học qua bài hát</h2><p class="sub">Lời bài hát có bản quyền nên app không chép lời. Bấm để mở bản có lời (lyrics video) trên YouTube.</p>
 <div class="media"><b>Nhiệm vụ mỗi bài hát</b>${SONG_TASKS.map(t=>`<span class="task">• ${esc(t)}</span>`).join('')}</div>
 <div class="tlist" style="margin-top:12px">${SONGS.map((s,i)=>`<div class="tcard"><h3>${esc(s[0])}</h3><span class="src">${esc(s[1])}</span><span class="sub">${esc(s[2])}</span><div class="row" style="margin-top:6px"><a class="btn ghost" style="text-align:center;text-decoration:none;padding:10px" href="${YT(s[0]+' '+s[1]+' lyrics')}" target="_blank" rel="noopener">Nghe ↗</a><button class="btn" style="padding:10px" onclick="claim('s${i}',15)">Xong +15</button></div></div>`).join('')}</div>`;toTop()}
function mchk(i){const all=[...document.querySelectorAll(`[id^="mt${i}_"]`)].every(c=>c.checked);$('#mc'+i).disabled=!all}
// ---- Thi thử ----
let MT=null;
function test(){mark('test');
 $('#app').innerHTML=ph('Thi thử','Đề mini theo format IELTS do app soạn, có đáp án và band ước tính ngay sau khi nộp. Có thêm phiếu chấm cho đề trong sách Cambridge của bạn.')+`<div class="grid">
 <button class="card" style="--c:var(--cL)" onclick="mtL()"><span class="ico">♪</span><h3>Listening</h3><span class="sub">2 phần · 10 câu · ~8 phút</span></button>
 <button class="card" style="--c:var(--cR)" onclick="mtR()"><span class="ico">≡</span><h3>Reading</h3><span class="sub">1 bài đọc · 8 câu · 15 phút</span></button>
 <button class="card" style="--c:var(--cW)" onclick="mtW(1)"><span class="ico">✎</span><h3>Writing Task 1</h3><span class="sub">Biểu đồ cột · 20 phút</span></button>
 <button class="card" style="--c:var(--cW)" onclick="mtW(2)"><span class="ico">✎</span><h3>Writing Task 2</h3><span class="sub">Nghị luận · 40 phút</span></button>
 <button class="card" style="--c:var(--cS)" onclick="start('S')"><span class="ico">◉</span><h3>Speaking</h3><span class="sub">Part 1–3 có bấm giờ</span></button>
 <button class="card" style="--c:var(--sun)" onclick="bookKey()"><span class="ico">C</span><h3>Chấm đề sách Cambridge</h3><span class="sub">Nhập đáp án từ sách của bạn, chấm 40 câu</span></button></div>`;toTop()}
const nrm=s=>String(s).toLowerCase().replace(/[£$.,]/g,'').replace(/\s+/g,' ').trim();
function mhead(t){document.body.classList.add('insess');window.ret=test;return `<div class="sess">${gHead(0)}<span class="tag" style="--c:var(--sun)">${t}</span>`}
function mtL(){const L=MOCK.listen;let n=0;
 $('#app').innerHTML=mhead('Thi thử · Listening')+`<p class="sub">Trong phòng thi bạn chỉ nghe 1 lần. Ở đây được nghe lại, nhưng hãy thử nghe 1 lần trước.</p>`+L.map((p,pi)=>`<h2 class="sec">${p.part}</h2><button class="play" onclick="say(MOCK.listen[${pi}].audio,.9)"><span>▶ Nghe phần ${pi+1}</span><small>bấm lần nữa để nghe lại</small></button>`+
  p.qs.map(q=>{n++;return q.length===2?`<label class="task" style="flex-direction:column;gap:4px;margin-bottom:10px">${n}. ${esc(q[0])}<input class="inp" id="lq${n}" autocomplete="off" autocapitalize="off"></label>`:
   `<div style="margin-bottom:12px"><b>${n}. ${esc(q[0])}</b>${q[1].map((o,oi)=>`<label class="task"><input type="radio" name="lq${n}" value="${oi}">${String.fromCharCode(65+oi)}. ${esc(o)}</label>`).join('')}</div>`}).join('')).join('')+
  `<button class="btn" onclick="gradeL()" style="margin-top:12px">Nộp bài & xem đáp án</button><div id="res"></div></div>`;toTop()}
function gradeL(){let n=0,c=0,rows='';MOCK.listen.forEach(p=>p.qs.forEach(q=>{n++;let ok,got,ans;
 if(q.length===2){const e=$('#lq'+n);got=e.value;ok=q[1].includes(nrm(got));ans=q[1][0];e.classList.add(ok?'r':'w')}
 else{const s=document.querySelector(`[name=lq${n}]:checked`);got=s?q[1][+s.value]:'(bỏ trống)';ok=s&&+s.value===q[2];ans=q[1][q[2]]}
 if(ok)c++;rows+=`<tr><td>${n}</td><td>${ok?'✓':'✗'}</td><td>${esc(got||'(bỏ trống)')}</td><td><b>${esc(ans)}</b></td></tr>`}));
 mres(c,n,BAND_L,rows,MOCK.listen.map((p,i)=>`<details class="wl"><summary>Transcript phần ${i+1}</summary><p>${esc(p.audio)}</p></details>`).join(''),'L')}
function mres(c,n,tb,rows,extra,k){const sc=Math.round(c/n*40),b=toBand(sc,tb);
 if(!MT||MT!==k){S.xp+=c*5;const d=day();d.xp+=c*5;if(!d.sk.includes(k))d.sk.push(k);S.sk[k]+=c*5;save();MT=k}
 if(c/n>=.6){sfx.win();confetti()}
 $('#res').innerHTML=`<div class="sum" style="padding:20px 0 6px"><p class="sub">Đúng ${c}/${n} câu · quy ra khoảng ${sc}/40</p><div class="band pop">Band ~${b}</div><p class="sub">Ước tính từ đề mini, chỉ để tham khảo. +${c*5} XP</p></div>
 <table class="res"><tr><th>Câu</th><th></th><th>Bạn trả lời</th><th>Đáp án</th></tr>${rows}</table>${extra}<div class="row"><button class="btn ghost" onclick="exitS()">Về tab Thi thử</button></div>`;
 $('#res').scrollIntoView({behavior:'smooth'})}
function mtR(){const R=MOCK.read;MT=null;
 $('#app').innerHTML=mhead('Thi thử · Reading')+`<div class="timer" id="tm" style="font-size:2rem">15:00</div><h2 class="qtext">${R.title}</h2><div class="passage" style="max-height:none">${R.text.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`+
 R.qs.map((q,i)=>`<div style="margin-bottom:12px"><b>${i+1}. ${esc(q.q)}</b>${q.t==='gap'?`<input class="inp" id="rq${i}" autocomplete="off" autocapitalize="off" style="margin-top:6px">`:(q.t==='tfng'?TFN:q.o).map((o,oi)=>`<label class="task"><input type="radio" name="rq${i}" value="${oi}">${esc(o)}</label>`).join('')}</div>`).join('')+
 `<button class="btn" onclick="gradeR()">Nộp bài & xem đáp án</button><div id="res"></div></div>`;
 let left=900;window.tmr=setInterval(()=>{left--;const e=$('#tm');if(e)e.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(window.tmr);toast('Hết giờ! Nộp bài nhé.')}},1000);toTop()}
function gradeR(){clearInterval(window.tmr);let c=0,rows='';MOCK.read.qs.forEach((q,i)=>{let ok,got,ans;
 if(q.t==='gap'){const e=$('#rq'+i);got=e.value;ok=q.a.includes(nrm(got));ans=q.a[0];e.classList.add(ok?'r':'w')}
 else{const o=q.t==='tfng'?TFN:q.o,s=document.querySelector(`[name=rq${i}]:checked`);got=s?o[+s.value]:'';ok=s&&+s.value===q.a;ans=o[q.a]}
 if(ok)c++;rows+=`<tr><td>${i+1}</td><td>${ok?'✓':'✗'}</td><td>${esc(got||'(bỏ trống)')}</td><td><b>${esc(ans)}</b></td></tr>`});MT=null;
 mres(c,MOCK.read.qs.length,BAND_R,rows,'<p class="sub" style="margin-top:10px">Mẹo: Not Given là khi bài đọc không hề nhắc tới thông tin đó. False là khi bài đọc nói ngược lại.</p>','R')}
function mtW(k){const W=k===1?MOCK.w1:MOCK.w2,min=k===1?150:250;
 let chart='';if(k===1){const mx=50;chart=`<svg viewBox="0 0 320 180" style="width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0" role="img" aria-label="Biểu đồ cột phương tiện đi làm 2005 và 2025">${[0,10,20,30,40,50].map(v=>`<line x1="34" x2="312" y1="${150-v*2.6}" y2="${150-v*2.6}" stroke="#F2C6C9" stroke-width=".6"/><text x="28" y="${153-v*2.6}" font-size="8" text-anchor="end" fill="#7A5A5F">${v}%</text>`).join('')}${W.data.map((r,i)=>{const x=48+i*68;return `<rect x="${x}" y="${150-r[1]*2.6}" width="22" height="${r[1]*2.6}" fill="#F2A0AC"/><rect x="${x+24}" y="${150-r[2]*2.6}" width="22" height="${r[2]*2.6}" fill="#E4002B"/><text x="${x+11}" y="${146-r[1]*2.6}" font-size="8" text-anchor="middle" fill="#2A1216">${r[1]}</text><text x="${x+35}" y="${146-r[2]*2.6}" font-size="8" text-anchor="middle" fill="#2A1216">${r[2]}</text><text x="${x+23}" y="164" font-size="9" text-anchor="middle" fill="#2A1216">${r[0]}</text>`}).join('')}<rect x="200" y="170" width="8" height="8" fill="#F2A0AC"/><text x="211" y="177" font-size="8" fill="#2A1216">2005</text><rect x="245" y="170" width="8" height="8" fill="#E4002B"/><text x="256" y="177" font-size="8" fill="#2A1216">2025</text></svg>`}
 $('#app').innerHTML=mhead('Thi thử · Writing Task '+k)+`<p class="qtext" style="font-size:1.1rem">${esc(W.q)}</p>${chart}<ul class="list">${W.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
 <textarea class="inp" id="wt" style="margin-top:12px" placeholder="Viết bài của bạn ở đây..." aria-label="Bài viết" oninput="$('#wc').textContent=(this.value.trim().match(/\\S+/g)||[]).length"></textarea><p class="sub">Số từ: <b id="wc">0</b> / tối thiểu ${min}</p>
 <button class="btn" onclick="wDone(${k})">Nộp bài & xem bài mẫu</button><div id="res"></div></div>`;toTop()}
function wDone(k){const W=k===1?MOCK.w1:MOCK.w2,t=$('#wt').value,n=(t.trim().match(/\S+/g)||[]).length,min=k===1?150:250;
 const has=w=>new RegExp('\\b'+w+'\\b','i').test(t);
 const ck=[[n>=min,`Đủ ${min} từ (bạn viết ${n})`],[k===1?has('overall'):has('in conclusion')||has('to conclude'),k===1?'Có câu Overall':'Có kết bài (In conclusion…)'],[['however','in addition','moreover','firstly','by contrast','similarly','while','whereas'].some(has),'Có từ nối'],[t.split(/\n\s*\n/).length>=3,'Chia từ 3 đoạn trở lên']];
 if(n>=40){S.xp+=30;day().xp+=30;S.sk.W+=30;save();sfx.win()}
 $('#res').innerHTML=`<h2 class="sec">Tự kiểm tra</h2>${ck.map(c=>`<p class="task">${c[0]?'✅':'⬜'} ${c[1]}</p>`).join('')}<h2 class="sec">${k===1?'Bài mẫu (band ~6)':'Dàn ý gợi ý'}</h2><div class="passage" style="max-height:none;white-space:pre-line">${esc(k===1?W.model:W.outline)}</div>
 <p class="sub">App chưa chấm điểm bài viết tự động. Muốn chấm chi tiết, bạn copy bài và gửi Claude kèm câu: "Chấm bài IELTS Writing theo 4 tiêu chí".</p><button class="btn ghost" onclick="exitS()">Về tab Thi thử</button>`;$('#res').scrollIntoView({behavior:'smooth'})}
// ---- Phiếu chấm đề sách ----
function bk(){try{return JSON.parse(localStorage.getItem('ieltsq_keys')||'{}')}catch(e){return{}}}
function bookKey(){document.body.classList.add('insess');window.ret=test;const K=bk();
 $('#app').innerHTML=`<div class="sess">${gHead(0)}<span class="tag" style="--c:var(--sun)">Chấm đề sách Cambridge</span><h2 class="qtext">Phiếu trả lời 40 câu</h2>
 <p class="sub">Cách dùng với Cambridge IELTS 21 (hoặc cuốn bất kỳ) của bạn: 1) Làm bài trong sách. 2) Lần đầu, chép đáp án ở cuối sách vào ô Đáp án, mỗi dòng 1 câu. Nhiều đáp án đúng thì ngăn bằng dấu /, ví dụ: <b>10 / ten</b>. 3) Nhập câu trả lời của bạn vào 40 ô, bấm Chấm. Đáp án được lưu riêng trên máy bạn.</p>
 <div class="row"><select class="inp" id="bt" onchange="bkLoad()">${['Test 1','Test 2','Test 3','Test 4'].map(t=>`<option>${t}</option>`).join('')}</select><select class="inp" id="bs" onchange="bkLoad()"><option>Listening</option><option>Reading</option></select></div>
 <p class="sub">Có file <b>cam21_dap_an.txt</b>? Nạp một lần là đủ 4 test: <input type="file" accept=".txt" id="kf" onchange="bkFile(this)" aria-label="Nạp file đáp án"></p><details class="wl" id="kd"><summary>Đáp án (chép từ sách)</summary><textarea class="inp" id="bkey" style="margin-top:8px" placeholder="1 dòng = 1 câu, đủ 40 dòng"></textarea><button class="btn ghost" style="margin-top:8px" onclick="bkSave()">Lưu đáp án</button></details>
 <div class="ans" style="margin-top:14px">${Array.from({length:40},(_,i)=>`<label>${i+1}<input id="ba${i}" autocomplete="off" autocapitalize="off"></label>`).join('')}</div>
 <button class="btn" style="margin-top:14px" onclick="bkGrade()">Chấm</button><div id="res"></div></div>`;bkLoad();toTop()}
const bkId=()=>$('#bt').value+'|'+$('#bs').value;
function bkLoad(){const k=bk()[bkId()]||'';$('#bkey').value=k;$('#kd').open=!k;for(let i=0;i<40;i++){const e=$('#ba'+i);e.value='';e.className=''}$('#res').innerHTML=''}
function bkSave(){const K=bk();K[bkId()]=$('#bkey').value;try{localStorage.setItem('ieltsq_keys',JSON.stringify(K))}catch(e){}toast('Đã lưu đáp án cho '+bkId().replace('|',' · '));$('#kd').open=false}
function bkGrade(){const lines=$('#bkey').value.split('\n').map(s=>s.replace(/^\s*\d{1,2}[.)]\s+/,'').trim()).filter(Boolean);
 if(lines.length<40){toast(`Đáp án mới có ${lines.length}/40 dòng. Mở mục Đáp án để chép đủ.`);$('#kd').open=true;return}
 let c=0,wrong=[];for(let i=0;i<40;i++){const e=$('#ba'+i),acc=lines[i].split('/').flatMap(x=>[x.replace(/\([^)]*\)/g,''),x.replace(/[()]/g,'')]).map(nrm),ok=acc.includes(nrm(e.value))&&e.value.trim()!=='';e.className=ok?'r':'w';if(ok)c++;else wrong.push(`${i+1}: ${lines[i]}`)}
 const L=$('#bs').value==='Listening',b=toBand(c,L?BAND_L:BAND_R);if(c>=24){sfx.win();confetti()}
 $('#res').innerHTML=`<div class="sum" style="padding:18px 0 6px"><p class="sub">Đúng ${c}/40</p><div class="band pop">Band ~${b}</div><p class="sub">Theo bảng quy đổi ${L?'Listening':'Academic Reading'} phổ biến, chỉ mang tính ước tính.</p></div>${wrong.length?`<details class="wl" open><summary>${wrong.length} câu sai · đáp án đúng</summary><p>${wrong.map(esc).join('<br>')}</p></details>`:''}`}
// ---- Khởi động ----
shell();initSnd();
(function(){const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h)&&h!=='home')go(h);else home()})();
</script></body></html>
