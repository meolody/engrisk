<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D62839">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Engrisk w me">
<title>Engrisk w me</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Engrisk w me — red, white, pastel blue. Sidebar like claude.ai, full-width content. */
:root{
  --red:#D62839; --red-d:#A81E2D; --red-s:#FDECEE; --red-m:#F6C3C9;
  --blue:#3E7CB1; --blue-d:#2D5F8A; --blue-s:#EEF5FC; --blue-m:#C7DDF2;
  --ink:#1E2230; --muted:#6B7180; --line:#E5E7EC; --bg:#FFFFFF;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;overflow:hidden}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue-d)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{display:flex;height:100%;height:100dvh}
.side{width:248px;flex:0 0 248px;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;background:#fff}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--display);font-weight:800;font-size:1.12rem}
.brand i{width:30px;height:30px;border-radius:6px;background:var(--red);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.85rem}
.grp{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:8px 12px;border-radius:6px;font-weight:600;font-size:.94rem}
.nav:hover{background:var(--blue-s)}
.nav.on{background:var(--red-s);color:var(--red-d)}
.nav .ic{width:18px;text-align:center;opacity:.75}
.nav.sub{padding-left:40px;font-weight:500}
.main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{padding:0 40px 80px}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 -40px;padding:12px 40px;display:flex;align-items:center;gap:14px}
.lvl{background:var(--red);color:#fff;font-weight:800;font-family:var(--display);border-radius:5px;padding:3px 9px;font-size:.9rem}
.xpbar{flex:1;height:8px;background:var(--blue-s);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .4s}
.streak{font-weight:700;white-space:nowrap;font-size:.92rem}
.tabbar{display:none}
@media (max-width:880px){
 .side{display:none}
 .wrap{padding:0 16px 100px}.top{margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);padding:4px 0}
 .tabbar button b{font-size:1.05rem}
 .tabbar button.on{color:var(--red)}
 body.insess .tabbar{display:none}
}
.ph{padding:26px 0 6px}
.ph h1{font-size:1.75rem;font-weight:800}
.ph .crumb{font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
.ph .crumb button{background:none;border:0;padding:0;color:var(--blue-d);font-weight:700}
.hero{background:var(--red);color:#fff;border-radius:8px;padding:22px 24px;margin-top:18px}
.hero h1{font-size:1.9rem;font-weight:800}
.hero p{margin:6px 0 0;opacity:.92}
.sec{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c,var(--blue));border-radius:6px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c,var(--blue));transform:translateY(-2px)}
.card h3{font-size:1.02rem;font-weight:700}
.card .meta{font-size:.78rem;color:var(--muted);font-weight:600}
.card .sub,.sub{color:var(--muted);font-size:.9rem}
.card.done{background:var(--blue-s)}
.tick{display:inline-block;background:var(--blue);color:#fff;border-radius:3px;font-size:.7rem;font-weight:700;padding:1px 6px;margin-left:6px;vertical-align:middle}
.bar{height:5px;background:var(--blue-s);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.seg{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:16px 0 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 12px;font-weight:600;font-size:.88rem;white-space:nowrap}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.w{border:1px solid var(--blue-m);background:var(--blue-s);color:var(--ink);border-radius:5px;padding:5px 10px;font-weight:600;font-size:.92rem;text-align:left}
.w:hover{background:#fff;border-color:var(--blue)}
.wl{border-bottom:1px dashed var(--blue);background:none;border-top:0;border-left:0;border-right:0;padding:0;font-weight:700;color:var(--blue-d)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:11px 18px;font-weight:700;font-size:.95rem;text-align:center;text-decoration:none;display:inline-block}
.btn:hover{background:var(--red-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.blue{background:var(--blue)}.btn.blue:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue-d)}
.btn.wide{width:100%}
.empty{border:1px dashed var(--blue-m);background:var(--blue-s);border-radius:8px;padding:28px;text-align:center;color:var(--blue-d);margin-top:16px}
.empty b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--ink);margin-bottom:4px}
.note{background:var(--blue-s);border-left:3px solid var(--blue);border-radius:4px;padding:10px 14px;font-size:.92rem;margin-top:12px}
/* session */
.sess{max-width:760px;margin:0 auto;padding-top:18px}
.shead{display:flex;align-items:center;gap:12px}
.x{border:1px solid var(--line);background:#fff;border-radius:6px;width:36px;height:36px}
.prog{flex:1;height:8px;background:var(--blue-s);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);transition:width .3s}
.combo{font-family:var(--display);font-weight:800;color:var(--red);min-width:40px;text-align:right}
.tag{display:block;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue-d);margin:20px 0 6px}
.qtext{font-family:var(--display);font-size:1.35rem;font-weight:700;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;text-align:left;font-size:.97rem}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--blue);background:var(--blue-s)}
.opt.bad{border-color:var(--red);background:var(--red-s);animation:shake .3s}
.feed{margin-top:14px;border-radius:6px;padding:12px 14px;background:var(--blue-s);border-left:4px solid var(--blue)}
.feed.bad{background:var(--red-s);border-left-color:var(--red)}
.feed b{font-family:var(--display)}
.feed p{margin:4px 0 0}
.inp{width:100%;border:1.5px solid var(--line);border-radius:6px;padding:11px 12px;font:inherit;background:#fff}
.inp:focus{outline:none;border-color:var(--blue)}
textarea.inp{min-height:260px;resize:vertical;line-height:1.6}
.play{display:flex;align-items:center;gap:10px;border:1.5px solid var(--blue-m);background:var(--blue-s);border-radius:6px;padding:14px 16px;font-weight:700;color:var(--blue-d);width:100%;margin-bottom:14px}
.ipa{font-family:'Noto Sans','Segoe UI',sans-serif;color:var(--blue-d)}
.flip{perspective:1000px;margin:16px 0}
.flip .in{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flip.on .in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:8px}
.front{background:var(--red);color:#fff}.front b{font-family:var(--display);font-size:2rem}
.back{background:var(--blue-s);border:1.5px solid var(--blue-m);transform:rotateY(180deg)}.back b{font-family:var(--display);font-size:1.3rem;color:var(--blue-d)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mgrid>div{display:flex;flex-direction:column;gap:9px}
.opt.sel{border-color:var(--red)}
.sum{text-align:center;padding:30px 0}
.big{font-family:var(--display);font-size:3.2rem;font-weight:800;color:var(--red)}
.stats{display:flex;gap:10px;margin:18px 0}
.stats div{flex:1;border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:1.4rem;color:var(--blue-d)}
.timer{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--blue-d);text-align:center;margin:8px 0}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ans label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.88rem;color:var(--muted)}
.ans input{flex:1;min-width:0;padding:8px;border-radius:5px;border:1.5px solid var(--line);font:inherit;color:var(--ink)}
.ans input.r{border-color:var(--blue);background:var(--blue-s)}.ans input.w{border-color:var(--red);background:var(--red-s)}
.stage{border:1px solid var(--line);border-left:5px solid var(--blue-m);border-radius:6px;padding:18px 20px;margin-bottom:14px}
.stage.now{border-color:var(--red);border-left-color:var(--red)}
.sth{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.band{background:var(--blue-s);color:var(--blue-d);font-weight:800;font-family:var(--display);border-radius:5px;padding:5px 11px}
.stage.now .band{background:var(--red);color:#fff}
.sth .sub{margin-left:auto}
.sks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.sk{background:var(--blue-s);border-radius:5px;padding:10px 12px;font-size:.92rem}
.sk b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--blue-d)}
.sk.r{background:var(--red-s)}.sk.r b{color:var(--red-d)}
/* popup */
.mask{position:fixed;inset:0;background:rgba(30,34,48,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.pop{background:#fff;border-radius:10px;max-width:440px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(30,34,48,.25);animation:rise .2s}
.pop h2{font-size:1.6rem}
.pop .def{margin:12px 0;font-size:1.02rem}
.pop .src{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:11px 18px;border-radius:6px;z-index:60}
.fx{position:fixed;left:50%;top:36%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--blue);pointer-events:none;z-index:9;animation:up 1s forwards}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
audio{width:100%;margin-top:10px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes up{from{opacity:1}to{opacity:0;transform:translate(-50%,-80px)}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.mgrid .opt{font-size:.85rem;padding:10px}}
/* Lively pastel layer: red + white lead, with pink, peach, butter, lavender and sky tints */
:root{--pink:#FFE3E6;--peach:#FFE8D6;--butter:#FFF4CC;--lav:#ECE6FF;--sky:#E3F0FF;--pink-d:#C2364A;--peach-d:#B8612A;--butter-d:#9A7500;--lav-d:#6650B8;--sky-d:#2F68A8}
body{background:#FFFBFB}
.main{background:linear-gradient(#FFFBFB,#FFFBFB)}
.side{background:#fff}
.nav.on{background:var(--pink);color:var(--red-d)}
.nav:hover{background:#FFF3F4}
.nav .ic svg{width:18px;height:18px;vertical-align:-4px}
.top{background:rgba(255,251,251,.95)}
.hero{position:relative;overflow:hidden;background:var(--red);padding:26px 28px;border-radius:18px;display:flex;align-items:center;gap:24px}
.hero .ring{flex:0 0 auto}
.hero .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:2rem}
.hero .chips2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .chips2 span{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 12px;font-weight:600;font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{border:0;border-radius:18px;padding:18px 16px 16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;transition:transform .18s,box-shadow .18s;background:var(--bgc);color:var(--ink)}
.tile:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 12px 24px rgba(214,40,57,.12)}
.tile .ico{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.04)}
.tile .ico svg{width:30px;height:30px}
.tile h3{font-size:1.08rem;margin-top:auto}
.tile .sub{color:var(--fgc);font-weight:600;font-size:.82rem}
.cont{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ucard{border:0;border-radius:16px;background:#fff;padding:14px;display:flex;gap:14px;align-items:center;text-align:left;box-shadow:0 2px 0 #F3E3E5,0 6px 16px rgba(214,40,57,.06);transition:transform .15s}
.ucard:hover{transform:translateY(-3px)}
.ucard .num{flex:0 0 56px;height:56px;border-radius:14px;background:var(--bgc);color:var(--fgc);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.35rem;position:relative}
.ucard .num svg{position:absolute;inset:-4px;width:64px;height:64px}
.ucard .meta{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ucard h3{font-size:1rem;margin:2px 0}
.ucard .sub{font-size:.84rem}
.ucard.done .num{background:var(--red);color:#fff}
.goals{display:flex;gap:12px;flex-wrap:wrap}
.goal{flex:1;min-width:180px;border-radius:14px;padding:12px 14px;background:#fff;display:flex;gap:10px;align-items:center;font-weight:600;box-shadow:0 2px 0 #F3E3E5}
.goal i{width:26px;height:26px;border-radius:50%;border:2px solid var(--red-m);display:grid;place-items:center;font-style:normal;font-size:.8rem;flex:0 0 26px}
.goal.ok i{background:var(--red);border-color:var(--red);color:#fff}
.w{border:0;background:var(--sky);color:var(--sky-d);border-radius:99px;padding:6px 14px}
.w:nth-child(5n+2){background:var(--pink);color:var(--pink-d)}.w:nth-child(5n+3){background:var(--peach);color:var(--peach-d)}.w:nth-child(5n+4){background:var(--lav);color:var(--lav-d)}.w:nth-child(5n){background:var(--butter);color:var(--butter-d)}
.w:hover{transform:translateY(-2px);background:#fff;box-shadow:0 0 0 2px currentColor}
.seg button{border-radius:99px;border:0;background:#fff;box-shadow:0 1px 0 #F0DDE0}
.seg button.on{background:var(--red);color:#fff}
.btn{border-radius:12px;box-shadow:0 3px 0 var(--red-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-d)}
.btn.blue{box-shadow:0 3px 0 var(--blue-d)}
.btn.ghost{box-shadow:0 3px 0 var(--line)}
.btn.lav{background:var(--lav-d);box-shadow:0 3px 0 #4C3A93}.btn.peach{background:var(--peach-d);box-shadow:0 3px 0 #8A4519}
.stage{border:0;border-radius:18px;background:#fff;box-shadow:0 2px 0 #F3E3E5,0 8px 20px rgba(214,40,57,.06);border-left:0}
.stage.now{box-shadow:0 0 0 3px var(--red),0 8px 20px rgba(214,40,57,.12)}
.sk{border-radius:12px;background:var(--sky)}.sk:nth-child(4n+2){background:var(--pink)}.sk:nth-child(4n+3){background:var(--peach)}.sk:nth-child(4n){background:var(--lav)}
.sk b{color:var(--ink)}
.opt{border-radius:12px;border:2px solid #F0E4E6}
.feed{border-radius:12px}
.empty{border-radius:18px;background:var(--lav);border:0;color:var(--lav-d)}
.pop{border-radius:20px;border-top:8px solid var(--red)}
.pop .qd{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.story{background:#fff;border-radius:18px;padding:22px 24px;font-size:1.08rem;line-height:1.8;box-shadow:0 2px 0 #F3E3E5;max-width:760px}
.story p{margin:0 0 12px}
.story .wl{font-weight:700}
.stile{border:0;border-radius:18px;padding:18px;text-align:left;background:var(--bgc);display:flex;flex-direction:column;gap:6px;min-height:140px;transition:transform .15s}
.stile:hover{transform:translateY(-3px) rotate(.4deg)}
.stile h3{font-size:1.12rem}
.lives{font-size:1.3rem;letter-spacing:2px;color:var(--red)}
.hang{font-family:var(--display);font-size:2.2rem;letter-spacing:.3em;text-align:center;margin:18px 0;color:var(--ink);word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.keys button{border:0;border-radius:10px;background:var(--sky);font-weight:800;padding:10px 0;color:var(--sky-d)}
.keys button:disabled{opacity:.3}
.keys button.hit{background:var(--red);color:#fff;opacity:1}
/* PDF test viewer */
.tv{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;align-items:start;margin-top:12px}
.tv .doc{background:#fff;border-radius:14px;box-shadow:0 2px 0 #F3E3E5;padding:10px;max-height:calc(100dvh - 140px);overflow:auto}
.tv .doc canvas{width:100%;height:auto;display:block;margin:0 auto 10px;border:1px solid #F3E3E5;border-radius:6px}
.tv .side2{position:sticky;top:70px;max-height:calc(100dvh - 90px);overflow:auto;background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 0 #F3E3E5}
.tv .ans{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.key{font-size:.78rem;color:var(--blue-d);font-weight:700;margin-left:4px}
@media (max-width:980px){.tv{grid-template-columns:1fr}.tv .side2{position:static;max-height:none}.tv .doc{max-height:70dvh}}
.load{display:flex;gap:12px;flex-wrap:wrap}
.loadc{flex:1;min-width:240px;border-radius:16px;padding:16px;background:var(--bgc)}
.loadc b{display:block;font-family:var(--display);font-size:1.05rem}
.loadc .st{font-size:.85rem;font-weight:700;color:var(--fgc);margin:4px 0 10px}

const pronUnits=()=>UNITS.filter(u=>u.id.startsWith('evu-')&&u.w.filter(w=>IPA[w]).length>=6).map(u=>({...u,id:'pr-'+u.n,k:'pron',w:u.w.filter(w=>IPA[w])}));
function hasPractice(u){return u.k==='grammar'?!!GQ[u.id]:u.w.length>=4}
function nextUnit(k){const list=(k==='pron'?pronUnits():unitsOf(k)).filter(u=>u.st===S.stage&&hasPractice(u));return list.find(u=>!S.done[u.id])||list[0]}
function stageProg(st){const us=UNITS.filter(u=>u.st===st&&hasPractice(u));return [us.filter(u=>S.done[u.id]).length,us.length]}
// ===== Home =====
function home(){mark('home');const st=S.stage,[d,n]=stageProg(st),dd=D();
 const nv=nextUnit('vocab'),ng=nextUnit('grammar'),np=nextUnit('pron');
 const goals=[["Finish one lesson",dd.sk.length>=1],["Practise two different skills",dd.sk.length>=2],["Earn 60 XP today",dd.xp>=60]];
 $('#app').innerHTML=topbar()+`<div class="hero"><h1>Hi! Ready to learn?</h1><p>Stage ${st} · Band ${STAGES[st].band} · ${d}/${n} lessons done</p><div class="bar" style="background:rgba(255,255,255,.3)"><i style="width:${n?d/n*100:0}%;background:#fff"></i></div></div>
 <h2 class="sec">Continue</h2><div class="grid">
 ${nv?card(nv,'var(--red)','Vocabulary'):''}${ng?card(ng,'var(--blue)','Grammar'):''}${np?card(np,'var(--blue-m)','Pronunciation'):''}
 <button class="card" style="--c:var(--red-m)" onclick="go('tests')"><span class="meta">Tests</span><h3>Cambridge IELTS 21</h3><span class="sub">Check your answers instantly</span></button></div>
 <h2 class="sec">Today's goals · +30 XP bonus</h2><div class="grid">${goals.map(g=>`<div class="card" style="--c:${g[1]?'var(--blue)':'var(--line)'}"><h3>${g[1]?'✓ ':''}${g[0]}</h3></div>`).join('')}</div>
 <h2 class="sec">Skills</h2><div class="grid">${SKILLS.map((s,i)=>`<button class="card" style="--c:${i%2?'var(--blue)':'var(--red)'}" onclick="go('skill:${s[0]}')"><h3>${s[1]}</h3><span class="sub">${skillSub(s[0])}</span></button>`).join('')}</div>`;toTop()}
function skillSub(k){if(k==='vocab')return unitsOf('vocab').length+' units';if(k==='grammar')return unitsOf('grammar').length+' units';if(k==='pron')return pronUnits().length+' units';if(k==='listening'||k==='reading')return 'Cambridge IELTS 21 · 4 tests';return 'Cambridge IELTS 21 · 4 tests'}
function card(u,c,lab){const done=S.done[u.id];return `<button class="card ${done?'done':''}" style="--c:${c}" onclick="openUnit('${u.id}')"><span class="meta">${lab?lab+' · ':''}${esc(u.s)} · Unit ${u.n}${done?'<span class="tick">'+done+'%</span>':''}</span><h3>${esc(u.t)}</h3><span class="sub">${u.k==='grammar'?(GQ[u.id]?GQ[u.id].length+' questions':'Practice coming soon'):u.w.length+(u.id.startsWith('col-')?' collocations':' words')}</span></button>`}
// ===== Roadmap =====
function roadmap(){mark('roadmap');
 $('#app').innerHTML=ph('Roadmap 4.5 → 9.0')+STAGES.slice(1).map((r,i)=>{const s=i+1,[d,n]=stageProg(s);return `<section class="stage ${s===S.stage?'now':''}"><div class="sth"><span class="band">${r.band}</span><h3>Stage ${s}: ${r.t}</h3>${s===S.stage?'<b style="color:var(--red);font-size:.8rem">YOU ARE HERE</b>':''}<span class="sub">${r.time}</span></div>
 <p style="margin:10px 0 0">${r.goal}</p><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><p class="sub" style="margin:4px 0 0">${d}/${n} lessons done</p>
 <div class="sks"><div class="sk r"><b>Vocabulary</b>${r.V}</div><div class="sk"><b>Grammar</b>${r.G}</div><div class="sk r"><b>Pronunciation</b>${r.P}</div><div class="sk"><b>Listening</b>${r.L}</div><div class="sk r"><b>Reading</b>${r.R}</div><div class="sk"><b>Writing</b>${r.W}</div><div class="sk r"><b>Speaking</b>${r.S}</div><div class="sk"><b>Checkpoint</b>${r.ck}</div></div>
 <div class="row"><button class="btn ${s===S.stage?'':'ghost'}" onclick="S.stage=${s};save();go('skill:vocab')">${s===S.stage?'Start this stage':'Switch to this stage'}</button></div></section>`}).join('');toTop()}
// ===== Skills =====
function skillsHub(){mark('skills');$('#app').innerHTML=ph('Skills')+`<div class="grid">${SKILLS.map((s,i)=>`<button class="card" style="--c:${i%2?'var(--blue)':'var(--red)'}" onclick="go('skill:${s[0]}')"><h3>${s[1]}</h3><span class="sub">${skillSub(s[0])}</span></button>`).join('')}</div>`;toTop()}
function stageSeg(k){const f=window.stf||0;return `<div class="seg">${[0,1,2,3,4,5].map(s=>`<button class="${f===s?'on':''}" onclick="window.stf=${s};skill('${k}')">${s?'Stage '+s+' · '+STAGES[s].band:'All stages'}</button>`).join('')}</div>`}
function skill(k){mark('skill:'+k);if(window.stf===undefined)window.stf=S.stage;const f=window.stf;const name=SKILLS.find(s=>s[0]===k)[1];
 if(k==='vocab'||k==='grammar'||k==='pron'){
  const list=(k==='pron'?pronUnits():unitsOf(k)).filter(u=>!f||u.st===f);
  const books=[...new Set(list.map(u=>u.b))];
  $('#app').innerHTML=ph(name)+stageSeg(k)+books.map(b=>`<h2 class="sec">${esc(b)}</h2><div class="grid">${list.filter(u=>u.b===b).map(u=>card(u,k==='grammar'?'var(--blue)':'var(--red)')).join('')}</div>`).join('')+(list.length?'':`<div class="empty"><b>No lessons in this stage yet</b>Choose another stage.</div>`);toTop();return}
 if(k==='listening'){$('#app').innerHTML=ph(name)+`<h2 class="sec">Cambridge IELTS 21</h2><div class="grid">${[1,2,3,4].map(t=>`<button class="card" style="--c:var(--blue)" onclick="checker(${t},'Listening')"><span class="meta">Book p. ${C21[t].L} · Audioscript p. ${C21.audio}</span><h3>Test ${t} · Listening</h3><span class="sub">40 questions · answer sheet</span></button>`).join('')}</div>
  <h2 class="sec">Dictation</h2><div class="grid"><button class="card" style="--c:var(--red)" onclick="dictation()"><h3>Listen and type</h3><span class="sub">Words from Stage ${S.stage} units</span></button></div>`;toTop();return}
 if(k==='reading'){$('#app').innerHTML=ph(name)+`<h2 class="sec">Cambridge IELTS 21</h2><div class="grid">${[1,2,3,4].map(t=>`<button class="card" style="--c:var(--red)" onclick="checker(${t},'Reading')"><span class="meta">Book p. ${C21[t].R}</span><h3>Test ${t} · Academic Reading</h3><span class="sub">3 passages · 40 questions · 60 min</span></button>`).join('')}</div>`;toTop();return}
 if(k==='writing'){$('#app').innerHTML=ph(name)+`<h2 class="sec">Cambridge IELTS 21</h2><div class="grid">${[1,2,3,4].map(t=>[1,2].map(n=>`<button class="card" style="--c:${n===1?'var(--blue)':'var(--red)'}" onclick="writePad(${t},${n})"><span class="meta">Book p. ${C21[t].W}</span><h3>Test ${t} · Task ${n}</h3><span class="sub">${n===1?'20 min · 150+ words':'40 min · 250+ words'}</span></button>`).join('')).join('')}</div>
  <h2 class="sec">Useful vocabulary</h2><div class="grid">${['evu-92','evu-93','evu-94','evu-97','eva-79','eva-80','eva-81','col-32','col-33'].map(id=>card(UNITS.find(u=>u.id===id),'var(--red)')).join('')}</div>`;toTop();return}
 if(k==='speaking'){$('#app').innerHTML=ph(name)+`<h2 class="sec">Cambridge IELTS 21</h2><div class="grid">${[1,2,3,4].map(t=>`<button class="card" style="--c:var(--blue)" onclick="speakPad(${t})"><span class="meta">Book p. ${C21[t].S}</span><h3>Test ${t} · Speaking</h3><span class="sub">Parts 1–3 · timer and recorder</span></button>`).join('')}</div>`;toTop();return}}
function openUnit(id){const u=id.startsWith('pr-')?pronUnits().find(x=>x.id===id):UNITS.find(x=>x.id===id);if(!u)return;window.lastU=id;
 const k=u.k,name=SKILLS.find(s=>s[0]===k)[1],crumb=`<button onclick="go('skill:${k}')">← ${name}</button> · ${esc(u.s)} · Unit ${u.n}`;
 const col=u.id.startsWith('col-');let body='';
 if(k==='grammar'){const qs=GQ[u.id];body=qs?`<p class="sub">${qs.length} practice questions</p><div class="row"><button class="btn" onclick="runGrammar('${u.id}')">Start practice</button></div>`:`<div class="empty"><b>Practice coming soon</b>Study ${esc(u.s)} Unit ${u.n} in your book.</div>`}
 else if(k==='pron'){body=`<div class="row"><button class="btn" onclick="runPron('${u.id}',0)">Listen and choose</button><button class="btn blue" onclick="runPron('${u.id}',1)">Read the sounds</button></div><h2 class="sec">Words</h2><div class="grid">${u.w.map(w=>`<button class="card" style="--c:var(--blue-m)" data-w="${esc(w)}"><h3>${esc(w)}</h3><span class="ipa">/${esc(IPA[w])}/</span></button>`).join('')}</div>`}
 else{const m=u.w.filter(w=>(S.box[w]||0)>=2).length;
  body=`<p class="sub">${u.w.length} ${col?'collocations':'words'} · ${m} learned · tap any word for its definition</p><div class="row">${col?`<button class="btn" onclick="runCol('${u.id}')">Fill the gap</button><button class="btn blue" onclick="runBuild('${u.id}')">Build the phrase</button>`:`<button class="btn" onclick="runFlash('${u.id}')">Flashcards</button><button class="btn blue" onclick="runQuiz('${u.id}')">Quiz</button><button class="btn ghost" onclick="runMatch('${u.id}')">Match</button><button class="btn ghost" onclick="runSpell('${u.id}')">Spelling</button>`}</div>
  <h2 class="sec">${col?'Collocations':'Words'}</h2><div class="chips">${u.w.map(W).join('')}</div>`}
 $('#app').innerHTML=ph(esc(u.t),crumb)+body;toTop()}
// ===== Session engine =====
let Q=[],qi=0,ok=0,combo=0,sx=0,SU=null,SK='vocab',locked=false;
function mcq(o){o.opts=[...new Set(o.opts)];const s=shuf(o.opts.map((t,i)=>i));return Object.assign({kind:'mc'},o,{opts:s.map(i=>o.opts[i]),a:s.indexOf(o.a||0)})}
function begin(qs,unit,sk){Q=qs;qi=0;ok=0;combo=0;sx=0;SU=unit;SK=sk;document.body.classList.add('insess');window.ret=window.ret||(()=>unit?openUnit(unit):go(window.cur||'home'));show()}
function exitS(){clearInterval(window.tmr);try{speechSynthesis.cancel()}catch(e){}stopRec();const r=window.ret;window.ret=null;document.body.classList.remove('insess');if(r)r();else home()}
const shead=p=>`<div class="shead"><button class="x" onclick="exitS()" aria-label="Exit">✕</button><div class="prog"><i style="width:${p}%"></i></div><div class="combo" id="cb">${combo>1?'×'+combo:''}</div></div>`;
function show(){locked=false;if(qi>=Q.length)return finish();const q=Q[qi];let b='';
 if(q.audio)b+=`<button class="play" onclick="say(Q[qi].audio,${q.slow||.9})">▶ Play again</button>`;
 if(q.kind==='mc')b+=`<h2 class="qtext">${q.q}</h2><div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})">${esc(o)}</button>`).join('')}</div>`;
 if(q.kind==='type')b+=`<h2 class="qtext">${q.q}</h2><input class="inp" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" onkeydown="if(event.key==='Enter')chk()"><div class="row"><button class="btn" onclick="chk()">Check</button>${q.hint?`<button class="btn ghost" onclick="$('#ti').value=Q[qi].ans[0];$('#ti').focus()">Show first letter</button>`.replace("Q[qi].ans[0]","Q[qi].ans.slice(0,1)"):''}</div>`;
 if(q.kind==='order'){window.ord={t:[],p:shuf(q.words.map((w,i)=>i))};b+=`<h2 class="qtext">${q.q}</h2><div class="chips" id="tray" style="min-height:48px;border-bottom:2px solid var(--blue-m);padding-bottom:10px"></div><div class="chips" id="pool" style="margin-top:12px"></div><div class="row"><button class="btn" id="ck" onclick="chkO()" disabled>Check</button></div>`}
 $('#app').innerHTML=`<div class="sess">${shead(qi/Q.length*100)}<span class="tag">${esc(q.tag||'')} · ${qi+1}/${Q.length}</span>${b}<div id="fb"></div></div>`;toTop();
 if(q.kind==='order')drawO();if(q.audio)setTimeout(()=>say(q.audio,q.slow||.9),300);if(q.kind==='type')setTimeout(()=>{const e=$('#ti');if(e)e.focus()},50)}
function drawO(){const q=Q[qi],o=window.ord;$('#tray').innerHTML=o.t.map(i=>`<button class="w" onclick="mv(${i},0)">${esc(q.words[i])}</button>`).join('');$('#pool').innerHTML=o.p.map(i=>`<button class="w" onclick="mv(${i},1)">${esc(q.words[i])}</button>`).join('');$('#ck').disabled=o.p.length>0}
function mv(i,f){if(locked)return;const o=window.ord;if(f){o.p=o.p.filter(x=>x!==i);o.t.push(i)}else{o.t=o.t.filter(x=>x!==i);o.p.push(i)}drawO()}
function grade(right,msg){const q=Q[qi];locked=true;
 if(right){combo++;ok++;const g=10+Math.min(combo-1,5)*2;sx+=g;sfx.ok();fx('+'+g)}else{combo=0;sfx.bad()}
 if(q.w)S.box[q.w]=right?Math.min(4,(S.box[q.w]||0)+1):0;
 const c=$('#cb');if(c)c.textContent=combo>1?'×'+combo:'';
 $('#fb').innerHTML=`<div class="feed ${right?'':'bad'}"><b>${right?rnd(['Correct!','Great!','Nice one!','Spot on!']):rnd(['Not quite.','Almost!','Keep going.'])}</b><p>${msg||''}</p></div><div class="row"><button class="btn" id="nx" onclick="qi++;show()">Continue</button></div>`;$('#nx').focus()}
function pick(i){if(locked)return;const q=Q[qi];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===i)b.classList.add('bad')});grade(i===q.a,q.why)}
function chk(){if(locked)return;const q=Q[qi],v=$('#ti').value;if(!v.trim()){toast('Type your answer first');return}const r=q.acc.map(nrm).includes(nrm(v));grade(r,`Answer: ${WL(q.ans)}${q.why?'<br>'+q.why:''}`)}
function chkO(){if(locked)return;const q=Q[qi];grade(window.ord.t.map(i=>q.words[i]).join(' ')===q.ans,`Answer: ${WL(q.ans)}`)}
function finish(){const n=Q.length,acc=n?ok/n:0,bonus=acc===1?20:acc>=.8?10:0,pct=Math.round(acc*100);
 addXP(sx+bonus,SK);if(SU&&pct>=(S.done[SU]||0))S.done[SU]=pct;save();if(acc>=.6){sfx.win();confetti()}
 $('#app').innerHTML=`<div class="sess sum"><h2>${acc===1?'Perfect score!':acc>=.8?'Lesson complete!':acc>=.6?'Good job!':'Keep practising!'}</h2><div class="big">+${sx+bonus} XP</div>
 <div class="stats"><div><b>${ok}/${n}</b>correct</div><div><b>${pct}%</b>score</div><div><b>${S.streak}</b>day streak</div></div>
 <div class="row" style="justify-content:center"><button class="btn ghost" onclick="exitS()">Back</button><button class="btn" onclick="window.again&&window.again()">Try again</button></div></div>`}
// ===== Vocabulary exercises =====
const U=id=>id.startsWith('pr-')?pronUnits().find(x=>x.id===id):UNITS.find(x=>x.id===id);
const defW=u=>u.w.filter(w=>DEF[w]);
function distract(u,w,f){const pool=shuf(u.w.filter(x=>x!==w&&f(x)));const more=shuf(UNITS.filter(x=>x.st===u.st&&x.k===u.k).flatMap(x=>x.w)).filter(x=>x!==w&&f(x)&&!pool.includes(x));return [...new Set(pool.concat(more))].slice(0,3)}
function runQuiz(id){const u=U(id),ws=shuf(defW(u)).slice(0,8);window.again=()=>runQuiz(id);
 if(ws.length<3){toast('Not enough definitions in this unit yet');return}
 begin(ws.map((w,i)=>{if(i%2){const o=distract(u,w,x=>DEF[x]&&DEF[x]!==DEF[w]);return mcq({tag:'Meaning',w,q:`What does ${WL(w)} mean?`,opts:[DEF[w],...o.map(x=>DEF[x])],why:`${WL(w)}: ${esc(DEF[w])}`})}
  const o=distract(u,w,x=>DEF[x]&&DEF[x]!==DEF[w]);return mcq({tag:'Which word?',w,q:`Which word means “${esc(DEF[w])}”?`,opts:[w,...o],why:`${WL(w)}: ${esc(DEF[w])}`})}),id,'vocab')}
function runSpell(id){const u=U(id),ws=shuf(defW(u).filter(w=>!/[\/()…]/.test(w))).slice(0,6);window.again=()=>runSpell(id);
 if(!ws.length){toast('No words to spell in this unit');return}
 begin(ws.map(w=>({kind:'type',tag:'Spelling',w,audio:plain(w),q:`Listen and type the word.<br><span class="sub" style="font-family:var(--body);font-weight:400">${esc(DEF[w])}</span>`,ans:plain(w),acc:[plain(w)],hint:1})),id,'vocab')}
let FL=null;
function runFlash(id){const u=U(id);FL={u,ws:shuf(u.w),i:0,k:0};document.body.classList.add('insess');window.ret=()=>openUnit(id);drawFlash()}
function drawFlash(){const w=FL.ws[FL.i];if(!w){addXP(FL.k*2,'vocab');sfx.win();confetti();$('#app').innerHTML=`<div class="sess sum"><h2>${FL.ws.length} cards done</h2><div class="big">${FL.k} known</div><div class="row" style="justify-content:center"><button class="btn ghost" onclick="exitS()">Back</button><button class="btn" onclick="runQuiz('${FL.u.id}')">Take the quiz</button></div></div>`;return}
 $('#app').innerHTML=`<div class="sess">${shead(FL.i/FL.ws.length*100)}<span class="tag">Card ${FL.i+1}/${FL.ws.length} · tap to flip</span><div class="flip" onclick="this.classList.toggle('on')"><div class="in"><div class="fc front"><b>${esc(w)}</b>${IPA[w]?`<span>/${esc(IPA[w])}/</span>`:''}</div><div class="fc back"><b>${esc(w)}</b><span>${esc(DEF[w]||'No definition yet.')}</span></div></div></div>
 <div class="row"><button class="btn ghost" style="flex:1" onclick="fA(0)">Still learning</button><button class="btn blue" style="flex:1" onclick="fA(1)">I know it</button></div></div>`;setTimeout(()=>say(w,.85),200)}
function fA(r){const w=FL.ws[FL.i];S.box[w]=r?Math.min(4,(S.box[w]||0)+1):0;if(r){FL.k++;sfx.ok()}FL.i++;save();drawFlash()}
let MT=null;
function runMatch(id){const u=U(id),ws=shuf(defW(u)).slice(0,5);if(ws.length<3){toast('Not enough definitions in this unit yet');return}
 MT={id,ws,L:shuf(ws.map((w,i)=>i)),R:shuf(ws.map((w,i)=>i)),sel:null,done:[],err:0};document.body.classList.add('insess');window.ret=()=>openUnit(id);drawMatch()}
function drawMatch(){const b=(s,i,t)=>`<button class="opt ${MT.done.includes(i)?'ok':''} ${MT.sel&&MT.sel.s===s&&MT.sel.i===i?'sel':''}" ${MT.done.includes(i)?'disabled':''} onclick="mtc('${s}',${i})">${esc(t)}</button>`;
 $('#app').innerHTML=`<div class="sess">${shead(MT.done.length/MT.ws.length*100)}<span class="tag">Match each word to its meaning · mistakes: ${MT.err}</span><div class="mgrid"><div>${MT.L.map(i=>b('L',i,MT.ws[i])).join('')}</div><div>${MT.R.map(i=>b('R',i,DEF[MT.ws[i]])).join('')}</div></div></div>`}
function mtc(s,i){if(!MT.sel||MT.sel.s===s){MT.sel={s,i};return drawMatch()}
 if(MT.sel.i===i){MT.done.push(i);S.box[MT.ws[i]]=Math.min(4,(S.box[MT.ws[i]]||0)+1);sfx.ok();MT.sel=null;drawMatch();
  if(MT.done.length===MT.ws.length){Q=MT.ws;ok=Math.max(0,MT.ws.length-MT.err);sx=Math.max(10,60-8*MT.err);combo=0;SU=MT.id;SK='vocab';window.again=()=>runMatch(MT.id);finish()}}
 else{MT.err++;sfx.bad();MT.sel=null;drawMatch()}}
function runCol(id){const u=U(id),cs=shuf(u.w.filter(c=>!/[\/()]/.test(c))).slice(0,8);window.again=()=>runCol(id);
 const allLast=[...new Set(UNITS.filter(x=>x.id.startsWith('col-')).flatMap(x=>x.w).map(c=>c.split(' ').pop()))];
 begin(cs.map(c=>{const p=c.split(' '),gi=p.length>2&&Math.random()<.5?0:p.length-1,g=p[gi];const q=p.map((x,j)=>j===gi?'_____':x).join(' ');
  const pool=gi===0?[...new Set(UNITS.filter(x=>x.id.startsWith('col-')).flatMap(x=>x.w).map(c=>c.split(' ')[0]))]:allLast;
  return mcq({tag:'Collocation',q:`Complete: <b>${esc(q)}</b>`,opts:[g,...shuf(pool.filter(x=>x!==g&&!u.w.includes(q.replace('_____',x)))).slice(0,3)],why:`${WL(c)}`})}),id,'vocab')}
function runBuild(id){const u=U(id),cs=shuf(u.w.filter(c=>c.split(' ').length>=3&&!/[\/()]/.test(c))).slice(0,6);window.again=()=>runBuild(id);
 if(cs.length<2){toast('Not enough long phrases in this unit');return}begin(cs.map(c=>({kind:'order',tag:'Build the phrase',q:'Put the words in order.',words:c.split(' '),ans:c})),id,'vocab')}
// ===== Grammar & pronunciation =====
function runGrammar(id){window.again=()=>runGrammar(id);begin(shuf(GQ[id]).map(g=>mcq({tag:'Grammar',q:esc(g[0]),opts:g[1],why:esc(g[2])})),id,'grammar')}
function runPron(id,mode){const u=U(id),ws=shuf(u.w).slice(0,8);window.again=()=>runPron(id,mode);
 begin(ws.map(w=>{const o=distract(u,w,x=>IPA[x]);return mode?mcq({tag:'Read the sounds',w,q:`Which word is <span class="ipa">/${esc(IPA[w])}/</span>?`,opts:[w,...o],why:`${WL(w)} /${esc(IPA[w])}/`}):mcq({tag:'Listen and choose',w,audio:plain(w),slow:.8,q:'Which word do you hear?',opts:[w,...o],why:`${WL(w)} /${esc(IPA[w])}/`})}),id,'pron')}

  else body=`<div class="row">${col?`<button class="btn" onclick="runCol('${u.id}')">Fill the gap</button><button class="btn blue" onclick="runBuild('${u.id}')">Build the phrase</button>`:`<button class="btn" onclick="runFlash('${u.id}')">Flashcards</button><button class="btn blue" onclick="runQuiz('${u.id}')">Quiz</button><button class="btn peach" onclick="runMatch('${u.id}')">Match</button><button class="btn lav" onclick="runSpell('${u.id}')">Spelling</button>`}</div><h2 class="sec">${col?'Collocations':'Words'} · tap for the dictionary</h2><div class="chips">${u.w.map(W).join('')}</div>`}
 else body=bk?bookPanel(bk[0],0,0,`<button class="btn ghost" onclick="window.utab='prac';openUnit('${id}')">Go to practice →</button>`):`<div class="empty"><b>No book pages for this unit</b></div>`;
 $('#app').innerHTML=ph(esc(u.t),crumb)+tabs+body;toTop();
 if(tab!=='prac'&&bk){if(tab==='key')showBook(bk[0],bk[3],bk[3]+1);else showBook(bk[0],bk[1],bk[2])}}
// ===== Skills: Listening, Reading, Writing, Speaking — same card style as other skills =====
const _skill2=skill;
skill=function(k){if(!OG[k])return _skill2(k);mark('skill:'+k);const name=SKILLS.find(s=>s[0]===k)[1],sp=k[0].toUpperCase();
 $('#app').innerHTML=ph(name)+`<h2 class="sec">Theory · The Official Cambridge Guide to IELTS</h2><div class="cont">${OG[k].map((x,i)=>{const p=PAL[i%PAL.length],d=S.done['og-'+k+i];return `<button class="ucard ${d?'done':''}" style="--bgc:${p[0]};--fgc:${p[1]}" onclick="openOG('${k}',${i})"><span class="num">${ring(d?1:0,d?'#fff':'var(--red)')}${i+1}</span><span><span class="meta">Official Guide · Unit ${i+1}</span><h3>${esc(x[0])}</h3><span class="sub">Book p. ${x[1]}–${x[2]}${d?' · done':''}</span></span></button>`}).join('')}</div>
 <h2 class="sec">Practice tests · Cambridge IELTS 21</h2><div class="cont">${[1,2,3,4].map((t,i)=>{const p=PAL[(i+2)%PAL.length],sc=S.done['c21-'+t+sp];return `<button class="ucard ${sc?'done':''}" style="--bgc:${p[0]};--fgc:${p[1]}" onclick="openTest(${t},'${sp}')"><span class="num">${ring(sc?sc/40:0,sc?'#fff':'var(--red)')}${t}</span><span><span class="meta">Cambridge IELTS 21</span><h3>Test ${t} · ${name}</h3><span class="sub">${sc?sc+'/40':sp==='L'?'30 min · 40 questions':sp==='R'?'60 min · 40 questions':sp==='W'?'Tasks 1 and 2':'Parts 1–3'}</span></span></button>`}).join('')}</div>
 ${k==='listening'?`<h2 class="sec">Extra</h2><div class="cont"><button class="ucard" style="--bgc:var(--butter);--fgc:var(--butter-d)" onclick="dictation()"><span class="num">♪</span><span><span class="meta">Your vocabulary</span><h3>Dictation</h3><span class="sub">Listen and type words from Stage ${S.stage}</span></span></button></div>`:''}`;toTop()};
function openOG(k,i){const x=OG[k][i],name=SKILLS.find(s=>s[0]===k)[1],tab=window.otab||'book',a=x[1]+1,b=x[2]+1;
 $('#app').innerHTML=ph(esc(x[0]),`<button onclick="go('skill:${k}')">← ${name}</button> · Official Guide · Unit ${i+1}`)+
 `<div class="seg"><button class="${tab==='book'?'on':''}" onclick="window.otab='book';openOG('${k}',${i})">1 · Theory & exercises</button>${k==='listening'?`<button class="${tab==='scr'?'on':''}" onclick="window.otab='scr';openOG('${k}',${i})">2 · Recording scripts</button>`:''}<button class="${tab==='key'?'on':''}" onclick="window.otab='key';openOG('${k}',${i})">${k==='listening'?3:2} · Answer key</button></div>
 <div class="row"><button class="btn blue" onclick="S.done['og-${k}${i}']=100;addXP(20,'${k}');toast('Marked as done · +20 XP')">Mark unit as done</button></div><div class="doc bookdoc" id="doc"><p class="sub">Opening the book…</p></div>`;toTop();
 if(tab==='scr')showBook('og',OGX.scripts[0],OGX.scripts[1]);else if(tab==='key')showBook('og',OGX.key[0],OGX.key[1]);else showBook('og',a,b)}
// ===== Dictionary inside the pop-up (Wiktionary via the Free Dictionary API) =====
const DCACHE={};
async function dictLook(w){const q=plain(w).toLowerCase();if(DCACHE[q])return DCACHE[q];
 try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(q));if(!r.ok)return DCACHE[q]=null;return DCACHE[q]=await r.json()}catch(e){return null}}
function pop(w){const us=UNIT_OF[w]||[],ip=IPA[w];
 const m=document.createElement('div');m.className='mask';m.onclick=e=>{if(e.target===m)m.remove()};
 m.innerHTML=`<div class="pop" role="dialog" aria-label="${esc(w)}" style="max-height:86dvh;overflow:auto"><div style="display:flex;align-items:center;gap:12px"><h2 style="flex:1">${esc(w)}</h2><button class="btn blue" style="padding:8px 12px" onclick="say(${esc(JSON.stringify(w))},.85)">▶ Listen</button></div>
 ${ip?`<div class="ipa">/${esc(ip)}/</div>`:''}<div id="dd"><p class="sub">Looking up…</p></div>
 ${us.length?`<p class="src" style="margin-top:12px">In your books: ${us.slice(0,3).map(u=>`${esc(u.s)} · Unit ${u.n}`).join(' · ')}</p>`:''}
 <div class="row"><button class="btn ghost" onclick="this.closest('.mask').remove()">Close</button></div></div>`;
 document.body.appendChild(m);say(w,.85);
 dictLook(w).then(d=>{const box=m.querySelector('#dd');if(!box)return;
  if(d&&d[0]){const e=d[0],ph2=(e.phonetics||[]).find(p=>p.text),au=(e.phonetics||[]).find(p=>p.audio);
   box.innerHTML=`${!ip&&ph2?`<div class="ipa">${esc(ph2.text)}</div>`:''}${au?`<audio controls src="${esc(au.audio)}" style="height:34px"></audio>`:''}${d.flatMap(x=>x.meanings||[]).slice(0,3).map(mn=>`<p class="qd" style="margin:12px 0 2px">${esc(mn.partOfSpeech)}</p><ol style="margin:0;padding-left:20px">${mn.definitions.slice(0,3).map(df=>`<li style="margin-bottom:6px">${esc(df.definition)}${df.example?`<br><i class="sub">“${esc(df.example)}”</i>`:''}</li>`).join('')}</ol>${mn.synonyms&&mn.synonyms.length?`<p class="sub" style="margin:2px 0 0">Synonyms: ${mn.synonyms.slice(0,5).map(esc).join(', ')}</p>`:''}`).join('')}<p class="src" style="margin-top:10px">Dictionary: Wiktionary (CC BY-SA)</p>`}
  else box.innerHTML=DEF[w]?`<p class="def">${esc(DEF[w])}</p><p class="src">Dictionary: WordNet (offline)</p>`:'<p class="sub">No entry found.</p>'})}
// navigation additions
const _go=go;go=function(k){if(k==='books'){clearInterval(window.tmr);myBooks();try{history.replaceState(null,'','#books')}catch(e){}return}window.utab=window.otab=undefined;_go(k)};
const _shell=shell;shell=function(){_shell();$('#side').insertAdjacentHTML('beforeend',navB('books','My books','reading'))};

// ===== Start =====
shell();
(function(){const h=(location.hash||'').slice(1).replace('-',':');if(h==='books')go('books');else if(h&&(['home','roadmap','skills','fun','tests'].includes(h.split(':')[0])||h.startsWith('skill:')))go(h);else home()})();
</script></body></html>
